# File: docker-compose.yml
# Purpose: Base stack for local CI/CD platform
# Save to: docker-cicd-demo/docker-compose.yml
# Note: for local development/demo environment only

services:
  gitea:
    image: gitea/gitea:${GITEA_VERSION}
    container_name: gitea
    restart: unless-stopped
    ports:
      - "${GITEA_HTTP_PORT}:3000"   # Gitea web UI
      - "${GITEA_SSH_PORT}:22"      # Gitea SSH
    environment:
      - TZ=${TZ}
      - GITEA__server__ROOT_URL=http://${GITEA_DOMAIN}:${GITEA_HTTP_PORT}
      - GITEA__server__SSH_DOMAIN=${VM_IP}
      - GITEA__server__DOMAIN=${GITEA_DOMAIN}
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__database__DB_TYPE=sqlite3
    volumes:
      - gitea_data:/data
    networks:
      - cicd_net

  jenkins:
    build:
      context: ./docker-files
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_HTTP_PORT}:8080"   # Jenkins UI
      - "${JENKINS_AGENT_PORT}:50000" # Jenkins inbound agents
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cicd_net

  registry:
    image: registry:${REGISTRY_VERSION}
    container_name: registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_HTTP_PORT}:5000"   # Host ${REGISTRY_HTTP_PORT} -> container registry 5000
    environment:
      REGISTRY_AUTH: ${REGISTRY_AUTH}
      REGISTRY_AUTH_HTPASSWD_REALM: ${REGISTRY_AUTH_REALM}
      REGISTRY_AUTH_HTPASSWD_PATH: ${REGISTRY_AUTH_HTPASSWD_PATH}
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    volumes:
      - registry_data:/var/lib/registry
      - ./config/registry:/auth
    networks:
      - cicd_net

  npm:
    image: jc21/nginx-proxy-manager:${NPM_VERSION}
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT}:80"       # HTTP
      - "${NPM_ADMIN_PORT}:81"       # NPM admin UI
      - "${NPM_HTTPS_PORT}:443"     # HTTPS
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - cicd_net

  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION}
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_EDGE_PORT}:8000"
      - "${PORTAINER_HTTPS_PORT}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - cicd_net

volumes:
  gitea_data:
  jenkins_data:
  registry_data:
  npm_data:
  npm_letsencrypt:
  portainer_data:

networks:
  cicd_net:
    driver: bridge